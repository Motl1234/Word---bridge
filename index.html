<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+Bhaijaan+2:wght@500;700;800&family=Noto+Color+Emoji&display=swap">
<style>
/* Layout: a one-screen app. Words stand on the left bank, pictures on the right bank,
   and the player builds a plank bridge across the river for every correct pair. */
:root{
  --sky:#D9F0FF; --sky-2:#BCE2FF; --river:#8CCBFA;
  --ink:#17203D; --muted:#56628A;
  --paper:#FFFFFF; --paper-2:#EAF4FF; --edge:#17203D;
  --sun:#FFC83D; --on-accent:#17203D;
  --good:#12A150; --good-bg:#D9F7E5; --bad:#E5484D; --bad-bg:#FFE1E2;
  --rope:#8A5A2B; --plank:#D9A066; --shape:#6FA8FF; --blob-edge:#17203D;
  --overlay:rgba(23,32,61,.5);
  --font-ui:"Baloo Bhaijaan 2","Baloo 2",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --font-word:"Andika","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
  --font-emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky:#0D1430; --sky-2:#131C42; --river:#1D3F86;
    --ink:#F1F4FF; --muted:#A7B2D8;
    --paper:#1C2756; --paper-2:#27346F; --edge:#050919;
    --sun:#FFC83D; --on-accent:#17203D;
    --good:#35D083; --good-bg:#113B2A; --bad:#FF6B70; --bad-bg:#4A1A1E;
    --rope:#B98045; --plank:#E8B878; --shape:#7FB2FF; --blob-edge:#E8ECFF;
    --overlay:rgba(3,6,18,.66);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --sky:#0D1430; --sky-2:#131C42; --river:#1D3F86;
  --ink:#F1F4FF; --muted:#A7B2D8;
  --paper:#1C2756; --paper-2:#27346F; --edge:#050919;
  --sun:#FFC83D; --on-accent:#17203D;
  --good:#35D083; --good-bg:#113B2A; --bad:#FF6B70; --bad-bg:#4A1A1E;
  --rope:#B98045; --plank:#E8B878; --shape:#7FB2FF; --blob-edge:#E8ECFF;
  --overlay:rgba(3,6,18,.66);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:linear-gradient(180deg,var(--sky),var(--sky-2)) fixed;color:var(--ink);
  font-family:var(--font-ui);font-size:16px;line-height:1.35;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
#app{height:100%;max-width:640px;margin:0 auto;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 12px}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:14px;padding:4px 4px 16px;margin:0 -4px}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.ico{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ico.fill{fill:currentColor;stroke:none}
[dir="rtl"] .flip{transform:scaleX(-1)}
.emoji{font-family:var(--font-emoji);font-variant-emoji:emoji}

/* top bar */
.top{display:flex;align-items:center;gap:10px;min-height:52px}
.top h1{font-size:22px;font-weight:800;letter-spacing:-.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font-size:24px}
.top-actions{display:flex;gap:8px}

/* buttons */
.btn{font-weight:800;border:2.5px solid var(--edge);border-radius:16px;background:var(--paper);color:var(--ink);
  padding:8px 16px;box-shadow:0 4px 0 var(--edge);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:48px;transition:transform .06s,box-shadow .06s;text-align:center}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.btn.primary{background:var(--sun);color:var(--on-accent)}
.btn.icon{width:48px;padding:0;flex:none}
.btn.big{min-height:60px;font-size:19px;border-radius:20px;width:100%}
.btn.wide{width:100%}
.btn.danger{background:var(--bad-bg);border-color:var(--bad);box-shadow:0 4px 0 var(--bad)}
.btn[disabled]{opacity:.5;cursor:default}

/* home */
.hero{background:var(--paper);border:2.5px solid var(--edge);border-radius:24px;box-shadow:0 6px 0 var(--edge);padding:14px;display:flex;flex-direction:column;gap:12px}
.who{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;text-align:start;min-width:0}
.who .av{width:52px;height:52px;border-radius:50%;background:var(--sun);border:2.5px solid var(--edge);display:grid;place-items:center;font-size:28px;flex:none}
.who b{font-size:19px;font-weight:800;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who small{color:var(--muted);font-size:13px;font-weight:500}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--paper-2);border-radius:14px;padding:8px 6px;text-align:center;min-width:0}
.stat b{display:flex;align-items:center;justify-content:center;gap:5px;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);font-weight:500}
.stat .ico{width:18px;height:18px}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
h2.sec{font-size:18px;font-weight:800;margin-top:4px}
.levels{display:flex;flex-direction:column;gap:12px}
.lvl{display:grid;grid-template-columns:60px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border:2.5px solid var(--edge);border-radius:20px;
  background:var(--paper);box-shadow:0 5px 0 var(--edge);text-align:start;width:100%;cursor:pointer;color:var(--ink)}
.lvl:active{transform:translateY(3px);box-shadow:0 2px 0 var(--edge)}
.lvl .badge{width:60px;height:60px;border-radius:50%;background:var(--c);border:2.5px solid var(--edge);display:grid;place-items:center;font-size:32px}
.lvl .name{font-weight:800;font-size:17px;line-height:1.15}
.lvl .meta{font-size:13px;color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.lvl .side{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.lvl .side .ico{width:18px;height:18px}
.lvl.locked .badge{filter:grayscale(1);opacity:.55}
.lvl.locked .name,.lvl.locked .meta{opacity:.6}
.bar{height:10px;border-radius:99px;background:var(--paper-2);border:2px solid var(--edge);overflow:hidden;margin-top:5px}
.bar>i{display:block;height:100%;background:var(--c,var(--sun));width:var(--p,0%)}
.foot{font-size:13px;color:var(--muted);text-align:center;font-weight:500}
.notice{background:var(--paper);border:2px dashed var(--muted);border-radius:14px;padding:10px 12px;font-size:14px;font-weight:500}

/* level path */
.lvl-head{display:flex;align-items:center;gap:12px;background:var(--c);color:var(--on-accent);border:2.5px solid var(--edge);border-radius:20px;padding:10px 14px;box-shadow:0 5px 0 var(--edge)}
.lvl-head .m{font-size:40px;line-height:1}
.lvl-head b{font-size:19px;font-weight:800;display:block;line-height:1.15}
.lvl-head span{font-size:13px;font-weight:700}
.path{display:flex;flex-direction:column;align-items:center;gap:16px;padding:10px 0 30px}
.node{display:flex;flex-direction:column;align-items:center;gap:4px;transform:translateX(var(--dx,0));background:none;border:0;color:var(--ink);cursor:pointer;padding:0;width:170px}
.node .disc{width:76px;height:76px;border-radius:50%;background:var(--c);border:3px solid var(--edge);box-shadow:0 6px 0 var(--edge);display:grid;place-items:center;font-size:36px;position:relative;transition:transform .06s,box-shadow .06s}
.node:active .disc{transform:translateY(4px);box-shadow:0 2px 0 var(--edge)}
.node.locked .disc{background:var(--paper-2)}
.node.locked .disc .emoji{filter:grayscale(1);opacity:.45}
.node .lockbadge{position:absolute;inset-inline-end:-6px;bottom:-4px;width:28px;height:28px;border-radius:50%;background:var(--paper);border:2px solid var(--edge);display:grid;place-items:center}
.node .lockbadge .ico{width:15px;height:15px}
.node.next .disc{animation:bob 1.3s ease-in-out infinite}
.node .lbl{font-weight:800;font-size:14px;text-align:center;line-height:1.15}
.node .tag{font-size:12px;color:var(--muted);font-weight:500}
.stars{display:inline-flex;gap:2px;color:var(--sun)}
.stars .ico{width:16px;height:16px;stroke:var(--edge);stroke-width:1.6;fill:var(--paper-2)}
.stars .ico.on{fill:var(--sun)}

/* play */
.dots{display:flex;gap:6px;flex:1;justify-content:center;align-items:center;min-width:0}
.dots i{width:100%;max-width:44px;height:10px;border-radius:99px;background:var(--paper);border:2px solid var(--edge)}
.dots i.on{background:var(--good)}
.dots i.cur{background:var(--sun)}
.hint{text-align:center;font-weight:700;font-size:15px;min-height:22px}
.board{position:relative;flex:1;min-height:250px;display:grid;grid-template-columns:1fr 1fr;column-gap:clamp(50px,16vw,128px);
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.board::before{content:"";position:absolute;top:-2px;bottom:-2px;left:50%;width:clamp(26px,9vw,68px);transform:translateX(-50%);border-radius:99px;
  background:var(--river);opacity:.42}
.col{display:grid;grid-template-rows:repeat(4,minmax(0,1fr));gap:10px;min-height:0;position:relative;z-index:2}
.wires{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none;overflow:visible}
.card{position:relative;display:flex;align-items:center;justify-content:center;min-height:54px;padding:4px 8px;background:var(--paper);
  border:2.5px solid var(--edge);border-radius:18px;box-shadow:0 4px 0 var(--edge);cursor:pointer;transition:transform .08s,background .15s;min-width:0}
.card.sel{background:var(--sun);color:var(--on-accent);transform:translateY(-3px);box-shadow:0 7px 0 var(--edge)}
.card.done{background:var(--good-bg);border-color:var(--good);box-shadow:0 2px 0 var(--good);cursor:default}
.card.bad{background:var(--bad-bg);border-color:var(--bad);animation:shake .36s}
.card.word{flex-direction:column;gap:1px}
.w-text{font-family:var(--font-word);font-weight:700;font-size:calc(clamp(18px,5.6vw,29px)*var(--k,1));line-height:1.12;text-align:center}
.w-ar{font-size:13px;font-weight:700;color:var(--muted);direction:rtl;line-height:1.2;text-align:center}
.card.sel .w-ar{color:var(--on-accent)}
.w-ear{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--paper-2);border:2px solid var(--edge);color:var(--ink)}
.w-ear .ico{width:26px;height:26px}
.card.pic{--pic:clamp(30px,7.4vh,58px)}
.emo{font-family:var(--font-emoji);font-variant-emoji:emoji;font-size:var(--pic,40px);line-height:1.1;white-space:nowrap;direction:ltr}
.emo-2{font-size:calc(var(--pic,40px)*.74)}
.emo-3{font-size:calc(var(--pic,40px)*.56)}
.numwrap{font-size:var(--pic,40px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums;direction:ltr}
.blob,.shape{width:calc(var(--pic,40px)*1.12);height:calc(var(--pic,40px)*1.12);display:block}
.shape *{fill:var(--shape);stroke:var(--blob-edge);stroke-width:5;stroke-linejoin:round;stroke-linecap:round}
.shape .open{fill:none;stroke-width:9}
.cmp{display:inline-flex;align-items:flex-end;gap:6px;font-family:var(--font-emoji);line-height:1;direction:ltr}
.cmp-b{font-size:var(--pic,40px)}
.cmp-s{font-size:calc(var(--pic,40px)*.42)}
.cmp.is-big .cmp-s,.cmp.is-small .cmp-b{opacity:.28;filter:grayscale(1)}
.say{position:absolute;top:3px;right:3px;width:34px;height:34px;border-radius:50%;border:2px solid var(--edge);background:var(--paper-2);
  display:grid;place-items:center;cursor:pointer;padding:0;color:var(--ink)}
.say::after{content:"";position:absolute;inset:-7px}
.say .ico{width:18px;height:18px}
.say:active{transform:scale(.92)}
.tick{position:absolute;top:-8px;left:-8px;width:24px;height:24px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center;border:2px solid var(--paper)}
.tick .ico{width:13px;height:13px;stroke-width:3.4}
.playfoot{min-height:64px;display:flex;align-items:center;justify-content:center;gap:10px}
.playfoot .count{font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}

/* results */
.done{align-items:center;text-align:center}
.done .scroll{align-items:center;width:100%}
.bigstars{display:flex;gap:10px;justify-content:center;margin-top:8px}
.bigstars .ico{width:70px;height:70px;stroke:var(--edge);stroke-width:1.3;fill:var(--paper-2)}
.bigstars .ico.on{fill:var(--sun);animation:pop .5s both}
.bigstars .ico.on:nth-child(2){animation-delay:.18s}
.bigstars .ico.on:nth-child(3){animation-delay:.36s}
.done h2{font-size:30px;font-weight:800;line-height:1.1}
.done .sub{color:var(--muted);font-weight:700}
.unlock{background:var(--c);color:var(--on-accent);border:2.5px solid var(--edge);border-radius:18px;padding:10px 14px;font-weight:800;box-shadow:0 4px 0 var(--edge)}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px;width:100%}
.chip{display:flex;align-items:center;gap:8px;background:var(--paper);border:2px solid var(--edge);border-radius:14px;padding:6px 8px;cursor:pointer;text-align:start;min-width:0;color:var(--ink);--pic:26px}
.chip .pc{width:44px;flex:none;display:grid;place-items:center;overflow:hidden}
.chip .tx{min-width:0}
.chip b{font-family:var(--font-word);font-size:15px;display:block;line-height:1.15;overflow-wrap:anywhere}
.chip small{font-size:12px;color:var(--muted);font-weight:700;display:block;line-height:1.2}
.stack{display:flex;flex-direction:column;gap:10px;width:100%}

/* album + settings */
.filters{display:flex;gap:8px;flex-wrap:wrap}
.pill{border:2px solid var(--edge);border-radius:99px;background:var(--paper);padding:6px 14px;font-weight:800;font-size:14px;cursor:pointer;min-height:40px}
.pill.on{background:var(--sun);color:var(--on-accent)}
.empty{background:var(--paper);border:2.5px dashed var(--muted);border-radius:18px;padding:22px 16px;text-align:center;font-weight:700}
.set{background:var(--paper);border:2.5px solid var(--edge);border-radius:18px;box-shadow:0 4px 0 var(--edge);padding:4px 14px}
.set .line{display:flex;align-items:center;gap:12px;min-height:58px;border-top:2px solid var(--paper-2)}
.set .line:first-child{border-top:0}
.set .line>span{flex:1;min-width:0;font-weight:700}
.set .line small{display:block;color:var(--muted);font-weight:500;font-size:13px}
.seg{display:inline-flex;border:2px solid var(--edge);border-radius:12px;overflow:hidden;flex:none}
.seg button{border:0;background:var(--paper);padding:8px 12px;font-weight:800;cursor:pointer;min-height:40px}
.seg button.on{background:var(--sun);color:var(--on-accent)}
.sw{width:56px;height:32px;border-radius:99px;border:2px solid var(--edge);background:var(--paper-2);position:relative;cursor:pointer;flex:none;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .15s}
.sw.on{background:var(--good)}
.sw.on::after{transform:translateX(24px);background:#fff}
select,input[type=text]{font:inherit;font-weight:700;color:var(--ink);background:var(--paper-2);border:2px solid var(--edge);border-radius:12px;padding:8px 10px;min-height:42px;max-width:100%}
.players{display:flex;flex-direction:column;gap:10px}
.pl{display:flex;align-items:center;gap:10px;background:var(--paper);border:2.5px solid var(--edge);border-radius:18px;padding:8px 10px;box-shadow:0 4px 0 var(--edge)}
.pl.cur{background:var(--sun);color:var(--on-accent)}
.pl .av{width:46px;height:46px;border-radius:50%;background:var(--paper-2);border:2px solid var(--edge);display:grid;place-items:center;font-size:24px;flex:none}
.pl .nm{flex:1;min-width:0;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl small{font-weight:500;display:block;font-size:12px;opacity:.8}
.avs{display:flex;flex-wrap:wrap;gap:6px}
.avs button{width:44px;height:44px;border-radius:50%;border:2px solid var(--edge);background:var(--paper-2);font-size:22px;cursor:pointer;padding:0}
.avs button.on{background:var(--sun)}
.form{background:var(--paper);border:2.5px solid var(--edge);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px}
.form label{font-weight:800;font-size:14px}

#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
#toast{position:fixed;left:50%;top:calc(72px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--sky);
  padding:10px 16px;border-radius:14px;font-weight:700;font-size:14px;z-index:60;max-width:min(92vw,460px);text-align:center;box-shadow:0 6px 18px var(--overlay)}

@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
@keyframes pop{0%{transform:scale(.2) rotate(-25deg);opacity:0}70%{transform:scale(1.18) rotate(6deg);opacity:1}100%{transform:scale(1) rotate(0)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-height:520px){.hint{display:none}.playfoot{min-height:52px}.col{gap:6px}.card{min-height:44px}}
</style>

}
function pathD(a, b) {
  const sag = Math.min(14, Math.abs(b.x - a.x) * 0.12);
  return `M${a.x.toFixed(1)},${a.y.toFixed(1)} Q${((a.x + b.x) / 2).toFixed(1)},${((a.y + b.y) / 2 + sag).toFixed(1)} ${b.x.toFixed(1)},${b.y.toFixed(1)}`;
}
function mk(tag, attrs) { const e = document.createElementNS(NS, tag); Object.keys(attrs).forEach(k => e.setAttribute(k, attrs[k])); return e; }
function cardsFor(i) { return [board.querySelector(`.word[data-w="${i}"]`), board.querySelector(`.pic[data-w="${i}"]`)]; }
function drawBridges() {
  if (!board) return;
  wires.querySelectorAll('.bridge').forEach(n => n.remove());
  G.pairs.forEach(i => {
    const c = cardsFor(i), d = pathD(anchor(c[0]), anchor(c[1])), g = mk('g', { class: 'bridge' });
    g.appendChild(mk('path', { d, fill: 'none', stroke: 'var(--rope)', 'stroke-width': 13, 'stroke-linecap': 'round' }));
    g.appendChild(mk('path', { d, fill: 'none', stroke: 'var(--plank)', 'stroke-width': 7.5, 'stroke-dasharray': '3 6' }));
    wires.appendChild(g);
  });
}
function clearSel() { if (G.sel) G.sel.classList.remove('sel'); G.sel = null; }
function tapCard(c) {
  if (c.classList.contains('done') || G.lock) return;
  const pg = G.pages[G.pi];
  if (isWord(c) && (S.settings.sayTap || pg.listen)) sayWord(+c.dataset.w); else Sfx.tap();
  if (G.sel && G.sel !== c && isWord(G.sel) !== isWord(c)) { const a = G.sel; clearSel(); attempt(a, c); return; }
  if (G.sel === c) { clearSel(); return; }
  clearSel(); G.sel = c; c.classList.add('sel');
}
function attempt(a, b) {
  const wc = isWord(a) ? a : b, pc = isWord(a) ? b : a;
  if (wc.dataset.w === pc.dataset.w) {
    const i = +wc.dataset.w;
    [wc, pc].forEach(c => { c.classList.remove('sel', 'bad'); c.classList.add('done'); c.setAttribute('aria-disabled', 'true'); });
    const tx = wc.querySelector('.w-text'); tx.hidden = false;
    const ear = wc.querySelector('.w-ear'); if (ear) ear.hidden = true;
    if (S.settings.showAr) wc.querySelector('.w-ar').hidden = false;
    const tick = document.createElement('span'); tick.className = 'tick'; tick.innerHTML = IC.check; pc.appendChild(tick);
    G.pairs.push(i); G.matched++; drawBridges();
    Sfx.ok(); setTimeout(() => sayWord(i), 260);
    const p = P(), ls = learnedSet();
    if (!ls.has(KEY[i])) { p.learned.push(KEY[i]); ls.add(KEY[i]); }
    const cnt = app.querySelector('.count'); if (cnt) cnt.textContent = G.matched + ' / 4';
    if (G.matched === 4) pageComplete();
  } else {
    G.mistakes++; G.lock = true; Sfx.no();
    const line = mk('path', { d: pathD(anchor(wc), anchor(pc)), fill: 'none', stroke: 'var(--bad)', 'stroke-width': 7, 'stroke-linecap': 'round', 'stroke-dasharray': '2 12' });
    wires.appendChild(line);
    [wc, pc].forEach(c => c.classList.add('bad'));
    setTimeout(() => { line.remove(); [wc, pc].forEach(c => c.classList.remove('bad')); G.lock = false; }, 520);
  }
}
function pageComplete() {
  save();
  const last = G.pi === G.pages.length - 1;
  setTimeout(() => {
    if (route.name !== 'play') return;
    Sfx.page();
    const f = app.querySelector('.playfoot');
    if (f) { f.innerHTML = `<button class="btn primary big" data-act="nextpage"><span>${last ? t('finish') : t('next')}</span>${IC.next}</button>`; }
  }, 650);
}
function finishStage() {
  const p = P(), id = sid(G.L, G.s);
  const stars = G.mistakes === 0 ? 3 : G.mistakes <= 2 ? 2 : 1, prev = p.stars[id] || 0;
  if (stars > prev) p.stars[id] = stars;
  bumpStreak(p); p.last = { L: G.L, s: G.s };
  save();
  const seen = []; G.pages.forEach(pg => pg.w.forEach(i => { if (seen.indexOf(i) < 0) seen.push(i); }));
  go({ name: 'done', L: G.L, s: G.s, stars, mistakes: G.mistakes, first: prev === 0, words: seen });
  Sfx.win(); confetti();
}
function bindBoard() {
  board = app.querySelector('.board'); wires = board.querySelector('.wires'); drag = null;
  const temp = mk('path', { fill: 'none', stroke: 'var(--ink)', 'stroke-width': 5, 'stroke-linecap': 'round', 'stroke-dasharray': '1 10', opacity: 0.7 });
  const endDrag = () => { if (temp.parentNode) temp.remove(); drag = null; };
  board.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.say')) return;
    const c = e.target.closest('.card');
    if (!c || c.classList.contains('done') || G.lock || drag) return;
    e.preventDefault();
    drag = { from: c, x: e.clientX, y: e.clientY, moved: false, id: e.pointerId };
    try { board.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  });
  board.addEventListener('pointermove', (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 12) {
      drag.moved = true; clearSel(); G.sel = drag.from; drag.from.classList.add('sel');
      if (isWord(drag.from) && (S.settings.sayTap || G.pages[G.pi].listen)) sayWord(+drag.from.dataset.w);
      wires.appendChild(temp);
    }
    if (drag.moved) {
      const b = board.getBoundingClientRect(), a = anchor(drag.from);
      temp.setAttribute('d', `M${a.x},${a.y} L${e.clientX - b.left},${e.clientY - b.top}`);
    }
  });
  board.addEventListener('pointerup', (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    const d = drag; endDrag();
    if (!d.moved) { tapCard(d.from); return; }
    const hit = document.elementFromPoint(e.clientX, e.clientY);
    const target = hit && hit.closest ? hit.closest('.card') : null;
    if (target && target !== d.from && board.contains(target) && !target.classList.contains('done') && isWord(target) !== isWord(d.from)) { clearSel(); attempt(d.from, target); }
  });
  board.addEventListener('pointercancel', endDrag);
  board.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const c = e.target.closest('.card'); if (!c || e.target.closest('.say')) return;
    e.preventDefault(); tapCard(c);
  });
}

function vDone() {
  const r = route, lg = lang(), nx = nextAfter(r.L, r.s), p = P();
  const canNext = nx && isOpen(p, nx.L, nx.s);
  let unlock = '';
  if (r.s === 'c') {
    unlock = nx ? `<p class="unlock" style="--c:${META[nx.L].c}"><span class="emoji">${META[nx.L].e}</span> ${t('unlocked', nx.L + 1, META[nx.L][lg])}</p>` : `<p class="unlock" style="--c:${META[r.L].c}">${t('finishedAll')}</p>`;
  }
  const chips = r.words.map(i => `<button class="chip" data-act="say" data-say="${i}"><span class="pc">${picHTML(W[i])}</span><span class="tx"><b>${esc(W[i][0])}</b>${S.settings.showAr ? `<small dir="rtl">${esc(W[i][2])}</small>` : ''}</span></button>`).join('');
  const nextBtn = canNext ? `<button class="btn primary big" data-act="stage" data-l="${nx.L}" data-s="${nx.s}"><span>${nx.s === 0 && r.s === 'c' ? t('nextLevel', nx.L + 1) : t('nextStage')}</span>${IC.next}</button>` : '';
  return `<div class="screen done"><div class="scroll">
    ${starsHTML(r.stars, true)}
    <h2>${t('r' + r.stars)}</h2>
    <p class="sub">${t('level')} ${r.L + 1} · ${stageName(r.L, r.s)} · ${r.mistakes ? t('mistakes', r.mistakes) : t('mistakes0')}</p>
    ${unlock}
    <div class="stack">${nextBtn}
      <div class="row"><button class="btn" data-act="stage" data-l="${r.L}" data-s="${r.s}">${IC.replay}<span>${t('replay')}</span></button>
      <button class="btn" data-act="level" data-l="${r.L}">${IC.map}<span>${t('toMap')}</span></button></div></div>
    <p class="sub">${t('stageWords')}</p>
    <div class="chips">${chips}</div></div></div>`;
}

function vAlbum() {
  const ls = learnedSet(), lg = lang();
  const idx = []; W.forEach((w, i) => { if (ls.has(KEY[i]) && (albumFilter === 'all' || w[3] === albumFilter)) idx.push(i); });
  const pills = ['all', 'n', 'v', 'a', 'm'].map(k => `<button class="pill ${albumFilter === k ? 'on' : ''}" data-act="filter" data-f="${k}">${k === 'all' ? t('all') : POS[k][lg]}</button>`).join('');
  const chips = idx.map(i => `<button class="chip" data-act="say" data-say="${i}"><span class="pc">${picHTML(W[i])}</span><span class="tx"><b>${esc(W[i][0])}</b>${S.settings.showAr ? `<small dir="rtl">${esc(W[i][2])}</small>` : ''}</span></button>`).join('');
  return `<div class="screen">${topBar(t('album'), 'home')}
    <p style="font-weight:800">${t('albumCount', ls.size, TOTAL.toLocaleString('en-US'))}</p>
    <div class="filters">${pills}</div>
    <div class="scroll">${idx.length ? `<div class="chips">${chips}</div>` : `<p class="empty">${t('albumEmpty')}</p>`}</div></div>`;
}

function vSettings() {
  const s = S.settings, sw = (k) => `<button class="sw ${s[k] ? 'on' : ''}" role="switch" aria-checked="${!!s[k]}" data-act="toggle" data-k="${k}" id="sw-${k}"></button>`;
  const voices = Speech.list();
  const voiceLine = voices.length > 1 ? `<div class="line"><span>${t('sVoice')}</span><select id="voice-sel" data-change="voice">${voices.map(v => `<option value="${esc(v.voiceURI)}" ${v.voiceURI === s.voice ? 'selected' : ''}>${esc(v.name)}</option>`).join('')}</select></div>` : '';
  return `<div class="screen">${topBar(t('settings'), 'home')}<div class="scroll">
    <div class="set">
      <div class="line"><span>${t('sLang')}</span><span class="seg" style="flex:none"><button class="${s.lang === 'ar' ? 'on' : ''}" data-act="setlang" data-v="ar">العربية</button><button class="${s.lang !== 'ar' ? 'on' : ''}" data-act="setlang" data-v="en">English</button></span></div>
      <div class="line"><span>${t('sAr')}<small>${t('sArSub')}</small></span>${sw('showAr')}</div>
    </div>
    <div class="set">
      <div class="line"><span>${t('sSfx')}</span>${sw('sfx')}</div>
      <div class="line"><span>${t('sTap')}</span>${sw('sayTap')}</div>
      <div class="line"><span>${t('sSlow')}<small>${t('sSlowSub')}</small></span>${sw('slow')}</div>
      ${voiceLine}
      <div class="line"><span></span><button class="btn" data-act="testvoice">${IC.speaker}<span>${t('sTest')}</span></button></div>
    </div>
    <div class="set">
      <div class="line"><span>${t('sUnlock')}<small>${t('sUnlockSub')}</small></span>${sw('unlockAll')}</div>
    </div>
    <button class="btn wide" data-act="nav" data-to="players"><span>${t('players')}</span></button>
    <button class="btn wide danger" data-act="reset" id="reset-btn"><span>${t('sReset')}</span></button>
    <p class="foot">${Cloud.isOn() ? t('savedCloud') : t('savedLocal')}</p>
  </div></div>`;
}

let newAv = AVATARS[1];
function vPlayers() {
  const rows = S.players.map(p => {
    const cur = p.id === S.cur, tt = totals(p);
    return `<div class="pl ${cur ? 'cur' : ''}"><span class="av emoji">${esc(p.av)}</span><span class="nm">${esc(p.name)}<small>${tt.words} ${t('words')} · ${tt.stars} ${t('stars')}</small></span>
      ${cur ? `<span style="font-weight:800;font-size:13px">${t('playing')}</span>` : `<button class="btn" data-act="pick" data-id="${p.id}">${t('choose')}</button><button class="btn icon" data-act="delp" data-id="${p.id}" aria-label="${t('del')}">${IC.close}</button>`}</div>`;
  }).join('');
  const form = S.players.length < 6 ? `<div class="form"><label for="pl-name">${t('addPlayer')}</label>
      <input type="text" id="pl-name" maxlength="14" placeholder="${t('name')}" autocomplete="off">
      <div class="avs">${AVATARS.map(a => `<button class="emoji ${a === newAv ? 'on' : ''}" data-act="av" data-av="${a}" aria-label="avatar">${a}</button>`).join('')}</div>
      <button class="btn primary" data-act="addp">${IC.plus}<span>${t('add')}</span></button></div>` : `<p class="foot">${t('maxPlayers')}</p>`;
  return `<div class="screen">${topBar(t('players'), 'home')}<div class="scroll"><div class="players">${rows}</div>${form}</div></div>`;
}

/* ---------- actions ---------- */
let resetArmed = 0;
const ACT = {
  nav(b) { go({ name: b.dataset.to }); },
  lang() { ACT.setlang({ dataset: { v: lang() === 'ar' ? 'en' : 'ar' } }); },
  setlang(b) { S.settings.lang = b.dataset.v; if (b.dataset.v === 'ar') S.settings.showAr = true; applyLang(); save(); render(); },
  continue() { const nx = nextTarget(P()); if (nx) startStage(nx.L, nx.s); else go({ name: 'album' }); },
  level(b) {
    const L = +b.dataset.l;
    if (!isOpen(P(), L, 0)) { Sfx.no(); toast(t('lockedLevel', L)); return; }
    go({ name: 'level', L });
  },
  stage(b) {
    const L = +b.dataset.l, s = b.dataset.s === 'c' ? 'c' : +b.dataset.s;
    if (!isOpen(P(), L, s)) { Sfx.no(); toast(s === 0 ? t('lockedLevel', L) : t('lockedStage')); return; }
    startStage(L, s);
  },
  quit() { const L = G ? G.L : 0; G = null; go({ name: 'level', L }); },
  nextpage() { if (G.pi < G.pages.length - 1) { G.pi++; render(); } else finishStage(); },
  say(b) { sayWord(+b.dataset.say); },
  filter(b) { albumFilter = b.dataset.f; render(); },
  toggle(b) { const k = b.dataset.k; S.settings[k] = !S.settings[k]; save(); render(); const n = document.getElementById('sw-' + k); if (n) n.focus(); if (k === 'sfx' && S.settings.sfx) Sfx.ok(); },
  testvoice() { Speech.say("Hello! Let's play Word Bridge."); },
  reset(b) {
    const now = Date.now();
    if (now - resetArmed < 4000) { const p = P(); p.stars = {}; p.learned = []; p.streak = { last: '', n: 0 }; p.last = null; resetArmed = 0; save(); render(); toast(t('sResetDone')); }
    else { resetArmed = now; b.querySelector('span').textContent = t('sReset2'); }
  },
  pick(b) { S.cur = b.dataset.id; save(); go({ name: 'home' }); },
  delp(b) {
    if (b.dataset.armed) { S.players = S.players.filter(p => p.id !== b.dataset.id); save(); render(); }
    else { b.dataset.armed = '1'; b.classList.add('danger'); b.style.width = 'auto'; b.style.padding = '0 10px'; b.textContent = t('del2'); }
  },
  av(b) { newAv = b.dataset.av; app.querySelectorAll('.avs button').forEach(x => x.classList.toggle('on', x === b)); },
  addp() {
    if (S.players.length >= 6) return;
    const inp = document.getElementById('pl-name'); let n = 1; while (S.players.some(p => p.id === 'p' + n)) n++;
    const name = (inp && inp.value.trim()) || (t('player') + ' ' + (S.players.length + 1));
    S.players.push(newPlayer('p' + n, name.slice(0, 14), newAv)); S.cur = 'p' + n; save(); go({ name: 'home' });
  },
};
app.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const fn = ACT[b.dataset.act]; if (fn) fn(b, e);
});
app.addEventListener('change', (e) => {
  if (e.target && e.target.dataset && e.target.dataset.change === 'voice') { S.settings.voice = e.target.value; Speech.repick(); save(); Speech.say('Hello!'); }
});
window.addEventListener('pointerdown', () => { Speech.unlock(); Sfx.unlock(); }, { once: true, capture: true });
let rz = 0;
window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (route.name === 'play' && board && G) drawBridges(); }, 80); });

/* ---------- confetti ---------- */
function confetti() {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = document.getElementById('fx'), ctx = c.getContext('2d'), dpr = Math.min(2, window.devicePixelRatio || 1);
  c.width = window.innerWidth * dpr; c.height = window.innerHeight * dpr;
  const cols = ['#FFC83D', '#FF9EC0', '#5BCBF5', '#7EDC6A', '#B9A2FF', '#FF8A6B'];
  const ps = []; for (let i = 0; i < 90; i++) ps.push({ x: Math.random() * c.width, y: -20 - Math.random() * c.height * 0.4, vx: (Math.random() - 0.5) * 3 * dpr, vy: (2 + Math.random() * 4) * dpr, s: (5 + Math.random() * 7) * dpr, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3, c: cols[Math.random() * cols.length | 0] });
  const t0 = performance.now();
  (function frame(now) {
    const el = now - t0; ctx.clearRect(0, 0, c.width, c.height);
    if (el > 2600) return;
    ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.globalAlpha = Math.max(0, 1 - el / 2600); ctx.fillRect(-p.s / 2, -p.s / 3, p.s, p.s * 0.66); ctx.restore(); });
    requestAnimationFrame(frame);
  })(t0);
}

/* ---------- boot ---------- */
applyLang();
render();
Cloud.init();
window.__wb = { state: () => S, words: W.length };
})();

</script>
